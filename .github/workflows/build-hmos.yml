name: Build HarmonyOS for Courbet

on:
  workflow_dispatch:
  # build-mesa pushes the rebuilt .so files to main and then completes; chain
  # the ROM build off that instead of dispatching by hand.
  workflow_run:
    workflows: ["Build Mesa for Courbet"]
    types: [completed]
    branches: [main]

jobs:
  # needs: cannot cross workflow files, so the gate is the triggering run's
  # conclusion: a failed Mesa build must not produce a ROM with stale binaries.
  build-rom:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # Checkout FIRST: frees disk space without remounting the workspace
      # (easimon/maximize-build-space used to wipe the checked-out repo).
      - name: Checkout hmos-courbet repo
        uses: actions/checkout@v4

      - name: Sync the mesa binaries built by build-mesa
        run: |
          git fetch --no-tags origin main
          git checkout FETCH_HEAD -- patches/11-gpu-mesa/files/
          echo "== patches/11-gpu-mesa/files/lib64/chipsetsdk"
          ls -l patches/11-gpu-mesa/files/lib64/chipsetsdk/
          md5sum patches/11-gpu-mesa/files/lib64/chipsetsdk/*.so

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /opt/CodeQL || true
          sudo rm -rf /usr/local/lib/android /usr/share/kotlin /opt/azuredatacli /usr/lib/jvm || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs unzip curl brotli git
          pip install brotli

      - name: Fetch EROFS tools
        run: |
          chmod +x tools/fetch_tools.sh
          ./tools/fetch_tools.sh

      - name: Download HarmonyOS OTA (Pura 70, HarmonyOS 5.1)
        run: |
          mkdir -p /tmp/fw
          cd /tmp/fw

          echo "--- Скачивание OTA (~5.3 ГБ) ---"
          until curl -L --fail --retry 5 --retry-delay 5 -C - -H "User-Agent: Mozilla/5.0" \
            -o ota.zip \
            "http://update.dbankcdn.com/download/data/pub_13/HWHOTA_hota_900_9/c9/v3/fm2MH0XMR0m9EpxI0L2Zww/full/update_full_base.zip"; do
            echo "Обрыв, продолжаю..."
            sleep 5
          done

          echo "sha256 ota.zip ..."
          OBS=$(sha256sum ota.zip | cut -c1-64)
          echo "  $OBS"
          if [ "$OBS" != "1c872454021bc9c2479ee3f09ea6d96e4b8631119606468d1fa6af0a52d189d1" ]; then
            echo "ОШИБКА: пакет не совпадает с проверенной сборкой (ADY-LGRP3-CHN 205.1.0.128(SP5))"
            exit 1
          fi
          ls -la

      - name: Download LineageOS courbet
        run: |
          cd /tmp/fw
          # SourceForge (403 на айпишники датацентров) не годится; ROM берем с
          # Google Drive: LineageOS 23.2 (Omer), ~1.8 ГБ.
          ROM_ID=1IRjHBSXOJgGKHw6Kd36AtVdn_5BprpP4
          URLS=(
            "https://drive.usercontent.google.com/download?id=$ROM_ID&export=download&confirm=t"
          )

          echo "--- Скачивание LineageOS courbet ---"
          ok=""
          for attempt in 1 2 3 4; do
            IDX=$(( (attempt - 1) % 2 ))
            URL="${URLS[$IDX]}"
            echo "attempt $attempt: $URL"
            curl -L --fail --retry 3 --retry-delay 5 --connect-timeout 30 \
              -C - -H "User-Agent: Mozilla/5.0" -o rom.zip "$URL" && sleep 2
            if [ -f rom.zip ] && [ "$(stat -c%s rom.zip)" -gt 1500000000 ]; then
              if python3 -c "import zipfile,sys; sys.exit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)" rom.zip; then
                ok="downloaded"; break
              fi
            fi
            echo "  попытка $attempt не удалась (размер: $(stat -c%s rom.zip 2>/dev/null || echo 0)), заново..."
            rm -f rom.zip
            sleep 5
          done
          [ -n "$ok" ] || { echo "ROM так и не скачался"; ls -la; exit 1; }
          echo "ROM: $(stat -c%s rom.zip) байт"
          ls -la

      # Ожидаемые образы в ota.zip: update.bin; в rom.zip: boot.img, dtbo.img,
      # vendor.new.dat.br + vendor.transfer.list (блочные образы под sweetrom.py).
      - name: Inspect firmware archives
        run: |
          for f in /tmp/fw/ota.zip /tmp/fw/*.zip; do
            [ -f "$f" ] || continue
            echo "== $f"
            python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); [print('%12d  %s' % (i.file_size, i.filename)) for i in z.infolist()]" "$f"
          done

      # В скрипте нет --device-tree/--common-tree/--vendor-tree (аргументы не поддержаны),
      # блобы ядра/прошивок берутся из LineageOS courbet через --sweet-rom.
      - name: Run hmos2sweet for Courbet
        run: |
          python3 -u hmos2sweet.py \
            --ota /tmp/fw/ota.zip \
            --sweet-rom /tmp/fw/rom.zip \
            --out out \
            --patches defaults,50-remove-setup-wizard,-13-refresh-120hz

      # dtbo.img из предсборки собран под панель sweet; для courbet подменяем
      # его dtbo из LineageOS-зипа.
      - name: Replace dtbo.img with the courbet one
        run: |
          unzip -o /tmp/fw/rom.zip dtbo.img -d /tmp/fw/extracted
          if [ -f /tmp/fw/extracted/dtbo.img ]; then
            cp -f /tmp/fw/extracted/dtbo.img "$GITHUB_WORKSPACE/out/dtbo.img"
            echo "dtbo.img заменён на вариант courbet из LineageOS"
            ls -la "$GITHUB_WORKSPACE/out/dtbo.img"
          else
            echo "dtbo.img не найден в rom.zip, остаётся предсобранный"
          fi

      - name: Split large images
        if: always()
        run: |
          cd out 2>/dev/null || exit 0
          for f in *.img; do
            [ -f "$f" ] || continue
            if [ $(stat -c%s "$f") -gt 1800000000 ]; then
              split -b 1800M "$f" "${f}.part."
              rm "$f"
            fi
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmos-courbet-output
          path: out/
          if-no-files-found: warn
          retention-days: 7
