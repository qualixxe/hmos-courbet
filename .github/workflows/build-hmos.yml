name: Build HarmonyOS for Courbet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout custom hmos-courbet repo
        uses: actions/checkout@v4

      - name: Clone courbet sources
        run: |
          mkdir -p courbet-src
          cd courbet-src
          git clone --depth 1 https://github.com/abdalrahmaneissa/android_device_xiaomi_courbet.git
          git clone --depth 1 https://github.com/abdalrahmaneissa/android_device_xiaomi_sm6150-common.git
          git clone --depth 1 https://github.com/abdalrahmaneissa/proprietary_vendor_xiaomi_courbet.git

      - name: Maximize disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs unzip curl brotli git

      - name: Fetch EROFS tools
        run: |
          test -f tools/fetch_tools.sh || {
            echo "Missing tools/fetch_tools.sh in repo root"
            ls -la
            exit 1
          }
          chmod +x tools/fetch_tools.sh
          ./tools/fetch_tools.sh

      - name: Download OTA and ROM
        run: |
          mkdir -p /tmp/fw
          cd /tmp/fw

          echo "--- Скачивание HarmonyOS OTA ---"
          until curl -L --retry 5 --retry-delay 5 -C - -H "User-Agent: Mozilla/5.0" \
            -o ota.zip \
            "http://update.dbankcdn.com/download/data/pub_13/HWHOTA_hota_900_9/a3/v3/3tlkMNeBSxWqNthH3x2tXQ/full/update_full_base.zip"; do
            echo "Обрыв, продолжаю..."
            sleep 5
          done

          echo "--- Скачивание LineageOS courbet ---"
          until curl -L --retry 5 --retry-delay 5 -C - -H "User-Agent: Mozilla/5.0" \
            -o rom.zip \
            "https://sourceforge.net/projects/xiaomi-11-lite-projects/files/LineageOS/March_Update/lineage_courbet-22.2-20250331-UNOFFICIAL-courbet.zip/download"; do
            echo "Обрыв, продолжаю..."
            sleep 5
          done
          file ota.zip rom.zip

      - name: Run hmos2sweet for Courbet
        run: |
          ls -la
          python3 hmos2sweet.py \
            --ota /tmp/fw/ota.zip \
            --sweet-rom /tmp/fw/rom.zip \
            --out out \
            --patches defaults \
            --device-tree courbet-src/android_device_xiaomi_courbet \
            --common-tree courbet-src/android_device_xiaomi_sm6150-common \
            --vendor-tree courbet-src/proprietary_vendor_xiaomi_courbet

      - name: Split large images
        if: always()
        run: |
          cd out 2>/dev/null || exit 0
          for f in *.img; do
            [ -f "$f" ] || continue
            if [ $(stat -c%s "$f") -gt 1800000000 ]; then
              split -b 1800M "$f" "${f}.part."
              rm "$f"
            fi
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmos-courbet-output
          path: out/
          retention-days: 7
