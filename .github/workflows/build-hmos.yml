name: Build HarmonyOS for Courbet

on:
  workflow_dispatch:
  # build-mesa pushes the rebuilt .so files to main and then completes; chain
  # the ROM build off that instead of dispatching by hand.
  workflow_run:
    workflows: ["Build Mesa for Courbet"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  # needs: cannot cross workflow files, so the gate is the triggering run's
  # conclusion: a failed Mesa build must not produce a ROM with stale binaries.
  build-rom:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # Checkout FIRST: frees disk space without remounting the workspace
      # (easimon/maximize-build-space used to wipe the checked-out repo).
      - name: Checkout hmos-courbet repo
        uses: actions/checkout@v4

      - name: Sync the mesa binaries built by build-mesa
        run: |
          git fetch --no-tags origin main
          git checkout FETCH_HEAD -- patches/11-gpu-mesa/files/
          echo "== patches/11-gpu-mesa/files/lib64/chipsetsdk"
          ls -l patches/11-gpu-mesa/files/lib64/chipsetsdk/
          md5sum patches/11-gpu-mesa/files/lib64/chipsetsdk/*.so

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /opt/CodeQL || true
          sudo rm -rf /usr/local/lib/android /usr/share/kotlin /opt/azuredatacli /usr/lib/jvm || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs unzip curl brotli git aria2
          pip install brotli

      - name: Fetch EROFS tools
        run: ./tools/fetch_tools.sh

      - name: Download HarmonyOS OTA (Pura 70, HarmonyOS 5.1)
        run: |
          mkdir -p /tmp/fw
          cd /tmp/fw

          echo "--- Скачивание OTA (~5.3 ГБ) ---"
          # aria2 дробит файл на чанки и тянет их параллельно; контрольный .aria2 +
          # --continue подхватывают оборванный хвост вместо перезагрузки с нуля.
          aria2c -x 8 -s 8 \
            --continue=true --auto-file-renaming=false \
            --max-tries=0 --retry-wait=5 --connect-timeout=30 \
            --lowest-speed-limit=200K \
            --summary-interval=60 --console-log-level=warn \
            -d . -o ota.zip \
            "http://update.dbankcdn.com/download/data/pub_13/HWHOTA_hota_900_9/c9/v3/fm2MH0XMR0m9EpxI0L2Zww/full/update_full_base.zip"

          echo "sha256 ota.zip ..."
          OBS=$(sha256sum ota.zip | cut -c1-64)
          echo "  $OBS"
          if [ "$OBS" != "1c872454021bc9c2479ee3f09ea6d96e4b8631119606468d1fa6af0a52d189d1" ]; then
            echo "ОШИБКА: пакет не совпадает с проверенной сборкой (ADY-LGRP3-CHN 205.1.0.128(SP5))"
            exit 1
          fi
          ls -la

      - name: Download LineageOS courbet
        run: |
          cd /tmp/fw
          # SourceForge (403 на айпишники датацентров) не годится; ROM берем с
          # Google Drive: LineageOS 23.2 (Omer), ~1.8 ГБ.
          ROM_ID=1IRjHBSXOJgGKHw6Kd36AtVdn_5BprpP4
          ROM_URL="https://drive.usercontent.google.com/download?id=$ROM_ID&export=download&confirm=t"

          echo "--- Скачивание LineageOS courbet (~1.8 ГБ) ---"
          ok=""
          for attempt in 1 2 3 4; do
            echo "attempt $attempt: $ROM_URL"
            if aria2c -x 8 -s 8 \
                 --continue=true --auto-file-renaming=false \
                 --max-tries=3 --retry-wait=5 --connect-timeout=30 \
                 --lowest-speed-limit=200K \
                 --summary-interval=60 --console-log-level=warn \
                 -d . -o rom.zip "$ROM_URL" &&
               [ "$(stat -c%s rom.zip)" -gt 1500000000 ] &&
               python3 -c "import zipfile,sys; sys.exit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)" rom.zip; then
              ok="downloaded"; break
            fi
            echo "  попытка $attempt не удалась (размер: $(stat -c%s rom.zip 2>/dev/null || echo 0)), заново..."
            # Drive-ссылка живёт ограниченное время, оборванный хвост по ней не
            # продолжить -- начинаем этот файл заново.
            rm -f rom.zip rom.zip.aria2
            sleep 5
          done
          [ -n "$ok" ] || { echo "ROM так и не скачался"; ls -la; exit 1; }
          echo "ROM: $(stat -c%s rom.zip) байт"
          ls -la

      # Ожидаемые образы в ota.zip: update.bin; в rom.zip: boot.img, dtbo.img,
      # vendor.new.dat.br + vendor.transfer.list (блочные образы под sweetrom.py).
      - name: Inspect firmware archives
        run: |
          for f in /tmp/fw/ota.zip /tmp/fw/*.zip; do
            [ -f "$f" ] || continue
            echo "== $f"
            python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); [print('%12d  %s' % (i.file_size, i.filename)) for i in z.infolist()]" "$f"
          done

      # В скрипте нет --device-tree/--common-tree/--vendor-tree (аргументы не поддержаны),
      # блобы ядра/прошивок берутся из LineageOS courbet через --sweet-rom.
      - name: Run hmos2sweet for Courbet
        run: |
          python3 -u hmos2sweet.py \
            --ota /tmp/fw/ota.zip \
            --sweet-rom /tmp/fw/rom.zip \
            --out out \
            --keep-work \
            --patches defaults,50-remove-setup-wizard,-13-refresh-120hz

      # The Mesa link gate can only tell that a symbol is undefined, not whether
      # the device libc has it: qsort_r slipped through that way and blackened
      # the screen ("libgallium_dri.so s=qsort_r").  Publish the real export
      # lists from the OTA images that just got extracted, so build-mesa can
      # check every import against what HarmonyOS actually ships.  The images
      # are read directly: no patch here touches the system tree, so hmos2sweet
      # never extracts it.
      - name: Publish the device symbol lists the Mesa gate checks
        run: |
          set -eu
          python3 -u build/device_symbols.py /tmp/fw/ota.zip work
          rm -rf work

          # Same plumbing publish as build-mesa.yml: the work tree here is full
          # of build output, so the commit is assembled in a private index.
          git config user.name "qualixxe"
          git config user.email "qualixxe@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            BASE=$(git rev-parse FETCH_HEAD)
            rm -f "$RUNNER_TEMP/sym.index"
            GIT_INDEX_FILE="$RUNNER_TEMP/sym.index" git read-tree "$BASE"
            for f in build/device-symbols/*.txt; do
              GIT_INDEX_FILE="$RUNNER_TEMP/sym.index" \
                git update-index --add --cacheinfo 100644,"$(git hash-object --no-filters -w "$f")","$f"
            done
            TREE=$(GIT_INDEX_FILE="$RUNNER_TEMP/sym.index" git write-tree)
            if [ "$TREE" = "$(git rev-parse "$BASE^{tree}")" ]; then
              echo "device symbol lists unchanged"
              exit 0
            fi
            COMMIT=$(git commit-tree "$TREE" -p "$BASE" \
              -m "rom: publish the HarmonyOS symbol lists the Mesa gate checks")
            if git push origin "$COMMIT:refs/heads/main"; then
              echo "published $COMMIT"
              exit 0
            fi
            echo "main moved while this job ran, retrying ($attempt)"
          done
          exit 1

      # dtbo.img из предсборки собран под панель sweet; для courbet подменяем
      # его dtbo из LineageOS-зипа.
      - name: Replace dtbo.img with the courbet one
        run: |
          unzip -o /tmp/fw/rom.zip dtbo.img -d /tmp/fw/extracted
          if [ -f /tmp/fw/extracted/dtbo.img ]; then
            cp -f /tmp/fw/extracted/dtbo.img "$GITHUB_WORKSPACE/out/dtbo.img"
            echo "dtbo.img заменён на вариант courbet из LineageOS"
            ls -la "$GITHUB_WORKSPACE/out/dtbo.img"
          else
            echo "dtbo.img не найден в rom.zip, остаётся предсобранный"
          fi

      # Нарезка (>1800000000 байт) ломала прошивку: install_clean.bat флешит
      # "%OUT%system.img", а в artifact попадали только *.part.* -- lib/flashgen.py
      # части не склеивает. Артефакты носят файлы по 3 ГБ без проблем, так что
      # вместо нарезки проверяем, что каждый образ из скрипта на месте и это EROFS.
      - name: Verify the flash set
        run: |
          cd out
          ls -l
          python3 - <<'PY'
          import os, re, struct, sys

          bat = open('install_clean.bat', encoding='utf-8', errors='replace').read()
          refs = sorted(set(re.findall(r'%OUT%([A-Za-z0-9_.]+\.(?:img|bat|sh))', bat)))
          sizes = dict((n, int(s)) for n, s in re.findall(r'fastboot resize-logical-partition (\w+) (\d+)', bat))
          EROFS = ('system', 'vendor', 'chip_prod', 'sys_prod', 'cust', 'patch')

          def header(name):
              with open(name, 'rb') as f:
                  stem = name[:-4]
                  if stem in EROFS:
                      f.seek(1024)
                      return ('EROFS', struct.unpack('<I', f.read(4))[0] == 0xE0F5E1E2)
                  head = f.read(4)
                  if stem == 'boot':
                      return ('ANDROID boot', head == b'ANDR')
                  if stem == 'dtbo':
                      # LineageOS ships a DTBO container header; a bare DTB is also fine.
                      return ('DTBO/DTB', head in (b'\xd7\xb7\xab\x1e', b'\xd0\x0d\xfe\xed'))
                  return ('-', True)

          bad = []
          for name in refs:
              if not os.path.isfile(name):
                  bad.append('%s: файла нет в artifact' % name)
                  continue
              size = os.path.getsize(name)
              if name[:-4] in sizes and sizes[name[:-4]] != size:
                  bad.append('%s: %d байт, а resize-logical-partition ждёт %d' % (name, size, sizes[name[:-4]]))
              kind, ok = header(name)
              if not ok:
                  bad.append('%s: не похож на %s' % (name, kind))
          leftovers = [p for p in os.listdir('.') if '.part.' in p]
          if leftovers:
              bad.append('в out/ остались обломки нарезки: %s' % leftovers)
          for line in bad:
              print('::error::' + line)
          print('flash set: %d файлов, %d проблем' % (len(refs), len(bad)))
          sys.exit(1 if bad else 0)
          PY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmos-courbet-output
          path: out/
          if-no-files-found: warn
          retention-days: 7
