name: Build HarmonyOS Port

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # 1. Клонируем твой репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Освобождаем место на диске
      - name: Maximize disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 3. Ставим Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Ставим системные зависимости
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs unzip curl brotli

      # 5. Защита от ошибки "No such file": если папки tools нет, качаем её с оригинала
      - name: Verify and fetch tools directory
        run: |
          if [ ! -f tools/fetch_tools.sh ]; then
            echo "WARNING: tools/fetch_tools.sh not found in repo! Fetching from upstream..."
            git clone --depth 1 https://github.com/tsryzenstech/hmos2sweet.git /tmp/orig_hmos
            mkdir -p tools
            cp -r /tmp/orig_hmos/tools/* tools/
          fi
          echo "Files in tools/ directory:"
          ls -la tools/

      # 6. Запускаем EROFS утилиты
      - name: Fetch EROFS tools
        run: |
          chmod +x tools/fetch_tools.sh
          ./tools/fetch_tools.sh

      # 7. Качаем образы
      - name: Download OTA and ROM
        run: |
          mkdir -p /tmp/fw
          echo "Downloading HarmonyOS OTA..."
          curl -L --retry 3 -H "User-Agent: Mozilla/5.0" \
            -o /tmp/fw/ota.zip \
            "http://update.dbankcdn.com/download/data/pub_13/HWHOTA_hota_900_9/a3/v3/3tlkMNeBSxWqNthH3x2tXQ/full/update_full_base.zip"
          
          echo "Downloading LineageOS courbet..."
          curl -L --retry 3 -H "User-Agent: Mozilla/5.0" \
            -o /tmp/fw/rom.zip \
            "https://sourceforge.net/projects/xiaomi-11-lite-projects/files/LineageOS/March_Update/lineage_courbet-22.2-20250331-UNOFFICIAL-courbet.zip/download"
          
          echo "Checking downloaded files:"
          file /tmp/fw/ota.zip /tmp/fw/rom.zip
          ls -lh /tmp/fw/

      # 8. Запускаем сам портер
      - name: Run hmos2sweet
        run: |
          python3 hmos2sweet.py \
            --ota /tmp/fw/ota.zip \
            --sweet-rom /tmp/fw/rom.zip \
            --out out \
            --patches defaults

      # 9. Разбиваем большие файлы (чтобы влезли в артефакты)
      - name: Split large images
        if: always()
        run: |
          cd out 2>/dev/null || exit 0
          for f in *.img; do
            [ -f "$f" ] || continue
            if [ $(stat -c%s "$f") -gt 1800000000 ]; then
              echo "Splitting $f..."
              split -b 1800M "$f" "${f}.part."
              rm "$f"
            fi
          done

      # 10. Загружаем результат
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmos-port-output
          path: out/
          retention-days: 7