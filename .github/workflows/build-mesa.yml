name: Build Mesa for Courbet

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: Mesa tag to build against (the OHOS patch is generated for 26.1.x)
        required: false
        default: mesa-26.1.8

permissions:
  contents: write

env:
  MESA_REF: ${{ inputs.mesa_ref || 'mesa-26.1.8' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout hmos-courbet repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-mako python3-yaml bison flex e2fsprogs unzip curl brotli git pkg-config binutils-aarch64-linux-gnu
          pip3 install --break-system-packages meson brotli

      - name: Fetch OpenHarmony 5.1 headers from GitHub mirrors
        run: |
          mkdir -p build/work/openharmony
          cd build/work/openharmony
          for r in hiviewdfx_hilog graphic_graphic_surface drivers_peripheral third_party_libdrm; do
            [ -d "$r" ] || git clone --depth 1 --branch OpenHarmony-5.1.0-Release \
              https://github.com/OpenHarmony/$r.git "$r"
          done

      - name: Prepare sysroot base
        run: |
          mkdir -p build/work/sysroot
          tar -xJf build/sysroot-base.tar.xz -C build/work/sysroot

      - name: Clone Mesa sources
        run: |
          mkdir -p build/work
          git clone --filter=blob:none --depth 1 --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git build/work/mesa
          echo "Mesa VERSION: $(cat build/work/mesa/VERSION)"

      - name: Build Mesa (OHOS EGL platform, freedreno/kgsl)
        run: |
          chmod +x build/ohos-clang build/ohos-clang++ build/build_mesa.sh
          ./build/build_mesa.sh

      - name: Upload built libraries
        uses: actions/upload-artifact@v4
        with:
          name: mesa-ohos-${{ env.MESA_REF }}
          path: patches/11-gpu-mesa/files/lib64/chipsetsdk/
          if-no-files-found: error
          retention-days: 14

      - name: Commit and push updated mesa .so
        run: |
          git config user.name "qualixxe"
          git config user.email "qualixxe@users.noreply.github.com"
          git add -A patches/11-gpu-mesa/files/lib64/chipsetsdk/
          if git diff --cached --quiet; then
            echo "no changes to the shipped Mesa binaries"
            exit 0
          fi
          git commit -m "mesa: rebuild $MESA_REF for courbet (GPU fence wait fix)"
          # Another commit can land on main while this job builds; rebase onto it
          # so the binaries still get published instead of losing the push.
          git fetch --no-tags origin main
          git rebase FETCH_HEAD
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY.git" HEAD:main
