name: Build Mesa for Courbet

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: Mesa tag to build against (the OHOS patch is generated for 26.1.x)
        required: false
        default: mesa-26.1.8

permissions:
  contents: write

env:
  MESA_REF: ${{ inputs.mesa_ref || 'mesa-26.1.8' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout hmos-courbet repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-mako python3-yaml bison flex e2fsprogs unzip curl brotli git pkg-config binutils-aarch64-linux-gnu
          pip3 install --break-system-packages meson brotli

      - name: Fetch OpenHarmony 5.1 headers from GitHub mirrors
        run: |
          mkdir -p build/work/openharmony
          cd build/work/openharmony
          for r in hiviewdfx_hilog graphic_graphic_surface drivers_peripheral third_party_libdrm; do
            [ -d "$r" ] || git clone --depth 1 --branch OpenHarmony-5.1.0-Release \
              https://github.com/OpenHarmony/$r.git "$r"
          done

      - name: Prepare sysroot base
        run: |
          mkdir -p build/work/sysroot
          tar -xJf build/sysroot-base.tar.xz -C build/work/sysroot

      - name: Clone Mesa sources
        run: |
          mkdir -p build/work
          git clone --filter=blob:none --depth 1 --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git build/work/mesa
          echo "Mesa VERSION: $(cat build/work/mesa/VERSION)"

      - name: Build Mesa (OHOS EGL platform, freedreno/kgsl)
        run: ./build/build_mesa.sh

      - name: Upload built libraries
        uses: actions/upload-artifact@v4
        with:
          name: mesa-ohos-${{ env.MESA_REF }}
          path: patches/11-gpu-mesa/files/lib64/chipsetsdk/
          if-no-files-found: error
          retention-days: 14

      - name: Commit and push updated mesa .so
        run: |
          git config user.name "qualixxe"
          git config user.email "qualixxe@users.noreply.github.com"
          DIR=patches/11-gpu-mesa/files/lib64/chipsetsdk
          # Whatever the build leaves dirty in the work tree -- the runner reported
          # "cannot rebase: You have unstaged changes" for three runs on
          # chmod-free, CRLF-free, submodule-free trees -- must not be able to
          # block publication, so build the commit with plumbing instead:
          # read main's tree into a private index, swap in the fresh .so files and
          # commit that.  The checked-out work tree is never consulted.
          echo "== work tree state, for the record =="
          git status --porcelain | head -20
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            BASE=$(git rev-parse FETCH_HEAD)
            rm -f "$RUNNER_TEMP/mesa.index"
            GIT_INDEX_FILE="$RUNNER_TEMP/mesa.index" git read-tree "$BASE"
            for f in "$DIR"/*.so; do
              GIT_INDEX_FILE="$RUNNER_TEMP/mesa.index" \
                git update-index --add --cacheinfo 100644,"$(git hash-object --no-filters -w "$f")","$f"
            done
            TREE=$(GIT_INDEX_FILE="$RUNNER_TEMP/mesa.index" git write-tree)
            if [ "$TREE" = "$(git rev-parse "$BASE^{tree}")" ]; then
              echo "no changes to the shipped Mesa binaries"
              exit 0
            fi
            COMMIT=$(git commit-tree "$TREE" -p "$BASE" \
              -m "mesa: rebuild $MESA_REF for courbet (GPU fence wait fix)")
            # Pushing a commit instead of a branch turns a commit that landed on
            # main during the build into a rejection, never an overwrite.
            if git push origin "$COMMIT:refs/heads/main"; then
              echo "published $COMMIT"
              exit 0
            fi
            echo "main moved while this job ran, rebuilding on its new tip ($attempt)"
          done
          echo "could not publish after 3 attempts"
          exit 1
